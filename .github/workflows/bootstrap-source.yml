name: bootstrap-source
on:
  push:
    paths:
      - bootstrap/READY
permissions:
  contents: write
jobs:
  expand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Expand validated source archive
        run: |
          python - <<'PY'
          import base64, io, shutil, zipfile
          from pathlib import Path, PurePosixPath
          parts = sorted(Path('bootstrap').glob('part-*.txt'))
          if not parts:
              raise SystemExit('no source chunks')
          raw = base64.b64decode(''.join(p.read_text() for p in parts), validate=True)
          with zipfile.ZipFile(io.BytesIO(raw)) as z:
              for info in z.infolist():
                  path = PurePosixPath(info.filename)
                  if path.is_absolute() or '..' in path.parts:
                      raise SystemExit(f'unsafe archive path: {info.filename}')
                  if info.file_size > 20 * 1024 * 1024:
                      raise SystemExit(f'oversized archive entry: {info.filename}')
              z.extractall('.')
          shutil.rmtree('bootstrap')
          Path('.github/workflows/bootstrap-source.yml').unlink()
          PY
      - name: Commit expanded source
        run: |
          git config user.name "sentinel-forge-bootstrap"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Publish SRIC Core v0.3.0 source"
          git push origin HEAD:main
