name: one-time-branch-cleanup
on:
  issues:
    types: [opened]
permissions:
  contents: write
jobs:
  cleanup:
    if: github.event.issue.title == 'SENTINEL_FORGE_BRANCH_CLEANUP'
    runs-on: ubuntu-latest
    steps:
      - name: Delete temporary publication refs
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, urllib.request
          repo = os.environ['REPO']
          token = os.environ['GH_TOKEN']
          for ref in ['agent/publish-source']:
              url = f'https://api.github.com/repos/{repo}/git/refs/heads/{ref}'
              req = urllib.request.Request(url, method='DELETE', headers={
                  'Authorization': f'Bearer {token}',
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
              })
              try:
                  urllib.request.urlopen(req).read()
              except urllib.error.HTTPError as exc:
                  if exc.code != 422 and exc.code != 404:
                      raise
          PY
