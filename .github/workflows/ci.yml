name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -c requirements/runtime-py311.lock -e '.[dev]'
      - run: python -m ruff check src tests
      - run: python -m mypy --strict src/sric
      - run: python -m pytest -q
      - run: PYTHONPATH=src python scripts/run-evals.py
      - run: python -m compileall -q src
      - run: python scripts/security-scan.py
      - name: Dependency audit
        run: |
          python -m pip install "pip-audit>=2,<3"
          python -m pip_audit
      - run: python scripts/generate-sbom.py --output sbom.cdx.json
      - run: python -m build
