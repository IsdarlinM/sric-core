name: Bug report
description: Report a reproducible defect. Do not disclose exploitable security vulnerabilities publicly.
title: "[Bug]: "
body:
  - type: textarea
    id: behavior
    attributes:
      label: Observed behavior
      description: "What happened?"
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Minimal safe steps using synthetic or authorized data.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
